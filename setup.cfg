[coverage:run]
source = apps, core
omit =
    */migrations/*
    */tests/*
    */__init__.py
    */apps.py
    */admin.py
    manage.py

[coverage:report]
show_missing = true
skip_covered = false
precision = 2

[isort]
profile = black
known_django = django
known_first_party = apps, core, eventease
sections = FUTURE,STDLIB,DJANGO,THIRDPARTY,FIRST_PARTY,LOCALFOLDER

[flake8]
max-line-length = 100
extend-ignore = E203, W503
exclude =
    migrations,
    __pycache__,
    .git,
    .venv,
    staticfiles
per-file-ignores =
    eventease/settings/*.py: F403, F401
