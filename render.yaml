services:
  - type: web
    name: eventease-api
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput"
    startCommand: "gunicorn eventease.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: eventease.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: eventease-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-nextjs-app.vercel.app"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: PAYMENT_GATEWAY
        value: "stripe"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_PROVIDER
        value: "resend"
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "EventEase <noreply@udbhavghimire.com.np>"
      - key: WEB_CONCURRENCY
        value: "2"

databases:
  - name: eventease-db
    databaseName: eventease
    user: eventease
    plan: free
