[pytest]
DJANGO_SETTINGS_MODULE = eventease.settings.dev
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    --cov=apps
    --cov=core
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=70
markers =
    unit: Pure unit tests (no DB or network)
    integration: Tests that use the database
    e2e: Full request/response cycle tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
